<!DOCTYPE html>
<html>
<head>

<title>ClerkAI Sales Assistant</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
}

.container{
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px #ddd;
}

h1{
text-align:center;
color:#111;
}

p{
text-align:center;
}

input, textarea, select, button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
background:#111;
color:white;
cursor:pointer;
}

button:hover{
opacity:.8;
}

#reply{
margin-top:20px;
padding:20px;
background:#f1f1f1;
border-radius:10px;
white-space:pre-line;
}

</style>

</head>

<body>

<div class="container">

<h1>🤖 ClerkAI</h1>

<p>AI Sales Assistant for your business</p>


<input id="business"
value="Luxury Watch"
placeholder="Business Name">


<input id="products"
value="Rolex watches, Smart watches, Gold watches"
placeholder="Products">


<input id="price"
value="Starting from $500"
placeholder="Price">


<select id="language">

<option value="English">
English
</option>

<option value="Persian">
Persian
</option>

</select>


<textarea id="message"
placeholder="Customer message"></textarea>


<button onclick="sendMessage()">
Send to AI
</button>


<div id="reply">
AI reply will appear here...
</div>


</div>


<script>

async function sendMessage(){

let res = await fetch(
"https://clerkai-api-2026.nnebin6.workers.dev",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

business:
document.getElementById("business").value,

products:
document.getElementById("products").value,

price:
document.getElementById("price").value,

message:
document.getElementById("message").value,

language:
document.getElementById("language").value

})

});


let data = await res.json();


document.getElementById("reply").innerHTML =
data.reply;


}

</script>


</body>
</html>
