<!DOCTYPE html>
<html>
<head>

<title>ClerkAI - AI Sales Assistant</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f5f7fb;
margin:0;
}

.container{
max-width:750px;
margin:40px auto;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px #ddd;
}

h1{
text-align:center;
}

.subtitle{
text-align:center;
color:#555;
}

input, textarea, select, button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;
}

button{
background:#111;
color:white;
cursor:pointer;
}

#reply{
margin-top:25px;
background:#f1f1f1;
padding:20px;
border-radius:12px;
white-space:pre-line;
}

</style>

</head>

<body>


<div class="container">


<h1>🤖 ClerkAI</h1>

<p class="subtitle">
AI Sales Assistant for any business
</p>


<input id="business"
placeholder="Business name">


<input id="products"
placeholder="Products or services">


<input id="price"
placeholder="Price information">


<select id="language">

<option value="English">
English
</option>

<option value="Persian">
Persian
</option>

</select>


<textarea id="message"
placeholder="Customer message">
</textarea>


<button onclick="sendMessage()">
Generate Sales Reply
</button>


<div id="reply">
AI response will appear here...
</div>


</div>



<script>


async function sendMessage(){


const response = await fetch(

"https://clerkai-api-2026.nnebin6.workers.dev",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

business:
document.getElementById("business").value,

products:
document.getElementById("products").value,

price:
document.getElementById("price").value,

message:
document.getElementById("message").value,

language:
document.getElementById("language").value

})

}

);


const data = await response.json();


document.getElementById("reply").innerHTML =
data.reply;


}


</script>


</body>
</html>
