<!DOCTYPE html>
<html>
<head>

<title>ClerkAI Sales Assistant</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
margin:0;
}

.container{
max-width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px #ddd;
}

h1{
text-align:center;
}

input,textarea,button{
width:100%;
padding:15px;
margin-top:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:16px;
}

button{
background:#111;
color:white;
cursor:pointer;
}

#reply{
margin-top:20px;
padding:20px;
background:#f1f1f1;
border-radius:10px;
min-height:50px;
}

</style>

</head>


<body>

<div class="container">

<h1>🤖 ClerkAI</h1>

<p>
AI Sales Assistant for your business
</p>


<input id="business"
value="Luxury Watch"
placeholder="Business Name">


<input id="products"
value="Rolex watches, Smart watches, Gold watches"
placeholder="Products">


<input id="price"
value="Starting from $500"
placeholder="Price">


<textarea id="message"
placeholder="Customer message"></textarea>


<button onclick="sendMessage()">
Send to AI
</button>


<div id="reply">
AI reply will appear here...
</div>


</div>


<script>

async function sendMessage(){

let res = await fetch(
"https://clerkai-api-2026.nnebin6.workers.dev",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

business:
document.getElementById("business").value,

products:
document.getElementById("products").value,

price:
document.getElementById("price").value,

message:
document.getElementById("message").value,

language:"English"

})
});


let data = await res.json();


document.getElementById("reply").innerHTML =
data.reply;


}

</script>


</body>
</html>
