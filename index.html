<!DOCTYPE html>
<html>
<head>

<title>ClerkAI - AI Sales Assistant</title>

<style>

body{
font-family:Arial, sans-serif;
background:#0f172a;
margin:0;
color:white;
}

.container{
max-width:800px;
margin:40px auto;
background:white;
color:#111;
padding:40px;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.logo{
text-align:center;
font-size:38px;
font-weight:bold;
}

.tagline{
text-align:center;
color:#555;
margin-bottom:30px;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,textarea,select,button{

width:100%;
padding:15px;
margin-top:8px;
border-radius:12px;
border:1px solid #ddd;
font-size:16px;
box-sizing:border-box;

}


button{

background:#2563eb;
color:white;
border:none;
cursor:pointer;
font-weight:bold;

}


button:hover{

background:#1d4ed8;

}


#reply{

margin-top:25px;
padding:20px;
background:#f1f5f9;
border-radius:15px;
white-space:pre-line;

}


.footer{

text-align:center;
margin-top:30px;
color:#777;

}

</style>

</head>


<body>


<div class="container">


<div class="logo">
🤖 ClerkAI
</div>


<div class="tagline">
AI Sales Assistant for Businesses Worldwide
</div>



<label>
Business Name
</label>

<input id="business"
placeholder="Example: Luxury Store">



<label>
Products / Services
</label>

<input id="products"
placeholder="Example: Watches, Software, Clothes">



<label>
Price Information
</label>

<input id="price"
placeholder="Example: Starting from $100">



<label>
Customer Language
</label>

<select id="language">

<option value="English">
English
</option>

<option value="Persian">
Persian
</option>

</select>



<label>
Customer Message
</label>

<textarea id="message"
rows="5"
placeholder="Write customer message...">
</textarea>



<button onclick="sendMessage()">
Generate AI Sales Reply
</button>



<div id="reply">
AI reply will appear here...
</div>



<div class="footer">
Powered by ClerkAI AI Engine
</div>


</div>



<script>


async function sendMessage(){


const response = await fetch(

"https://clerkai-api-2026.nnebin6.workers.dev",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

business:
document.getElementById("business").value,

products:
document.getElementById("products").value,

price:
document.getElementById("price").value,

message:
document.getElementById("message").value,

language:
document.getElementById("language").value

})

}

);



const data = await response.json();



document.getElementById("reply").innerText =
data.reply;


}


</script>


</body>
</html>
